<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .security-note {
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }

        .security-note::before {
            content: "🔒 ";
        }

        input::placeholder {
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Shipping Address</h2>

        <form id="addressForm" autocomplete="on">
            <div class="row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="John"
                        autocomplete="given-name" required>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe"
                        autocomplete="family-name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="organization">Company (optional)</label>
                <input type="text" id="organization" name="organization" placeholder="Acme Inc."
                    autocomplete="organization">
            </div>

            <div class="form-group">
                <label for="addressLine1">Street Address</label>
                <input type="text" id="addressLine1" name="addressLine1" placeholder="123 Main St"
                    autocomplete="address-line1" required>
            </div>

            <div class="form-group">
                <label for="addressLine2">Apartment, Suite, etc. (optional)</label>
                <input type="text" id="addressLine2" name="addressLine2" placeholder="Apt 4B"
                    autocomplete="address-line2">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" placeholder="New York"
                        autocomplete="address-level2" required>
                </div>

                <div class="form-group">
                    <label for="state">State / Province</label>
                    <input type="text" id="state" name="state" placeholder="NY"
                        autocomplete="address-level1" required>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="postalCode">Postal Code</label>
                    <input type="text" id="postalCode" name="postalCode" placeholder="10001"
                        autocomplete="postal-code" required>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" name="country" autocomplete="country" required>
                        <option value="">Select country</option>
                        <option value="US">United States</option>
                        <option value="CA">Canada</option>
                        <option value="GB">United Kingdom</option>
                        <option value="AU">Australia</option>
                        <option value="DE">Germany</option>
                        <option value="FR">France</option>
                        <option value="ES">Spain</option>
                        <option value="IT">Italy</option>
                        <option value="NL">Netherlands</option>
                        <option value="SE">Sweden</option>
                        <option value="JP">Japan</option>
                        <option value="CN">China</option>
                        <option value="IN">India</option>
                        <option value="BR">Brazil</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="+1 555 123 4567"
                        autocomplete="tel" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com"
                        autocomplete="email" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Save Address</button>

            <div class="security-note">
                Your address information is stored securely and only used for delivery purposes.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('addressForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                organization: document.getElementById('organization').value,
                addressLine1: document.getElementById('addressLine1').value,
                addressLine2: document.getElementById('addressLine2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                postalCode: document.getElementById('postalCode').value,
                country: document.getElementById('country').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };

            alert('Address form submitted successfully!\n\nNote: This is a demo form.');

            console.log('Form data:', formData);
        });
    </script>
</body>

</html>
