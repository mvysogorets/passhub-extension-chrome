<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .card-icon {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .card-icon img {
            width: 50px;
            height: auto;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .card-icon img:hover {
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .security-note {
            margin-top: 20px;
            padding: 15px;
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            border-radius: 5px;
            font-size: 13px;
            color: #555;
        }

        .security-note::before {
            content: "🔒 ";
        }

        input::placeholder {
            color: #aaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Payment Information</h2>

        <form id="creditCardForm">
            <div class="form-group">
                <label for="cardName">Cardholder Name</label>
                <input type="text" id="cardName" name="cardName" placeholder="John Doe" autocomplete="cc-name">
            </div>

            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="1234 5678 9012 3456"
                    autocomplete="cc-number" maxlength="19" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="expMonth">Expiration Date</label>
                    <div style="display: flex; gap: 10px;">
                        <select id="expMonth" name="expMonth" autocomplete="cc-exp-month">
                            <option value="">MM</option>
                            <option value="01">01</option>
                            <option value="02">02</option>
                            <option value="03">03</option>
                            <option value="04">04</option>
                            <option value="05">05</option>
                            <option value="06">06</option>
                            <option value="07">07</option>
                            <option value="08">08</option>
                            <option value="09">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                        </select>
                        <select id="expYear" name="expYear" autocomplete="cc-exp-year" required>
                            <option value="">YYYY</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                            <option value="2027">2027</option>
                            <option value="2028">2028</option>
                            <option value="2029">2029</option>
                            <option value="2030">2030</option>
                            <option value="2031">2031</option>
                            <option value="2032">2032</option>
                            <option value="2033">2033</option>
                            <option value="2034">2034</option>
                            <option value="2035">2035</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="4" autocomplete="cc-csc"
                        required>
                </div>
            </div>

            <div class="form-group">
                <label for="zipCode">Billing ZIP Code</label>
                <input type="text" id="zipCode" name="zipCode" autocomplete="postal-code" placeholder="12345"
                    maxlength="10" required>
            </div>

            <button type="submit" class="submit-btn">Process Payment</button>

            <div class="security-note">
                Your payment information is encrypted and secure. We never store your card details.
            </div>
        </form>
    </div>

    <script>
        // Format card number with spaces
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formattedValue;
        });

        // Only allow numbers for card number
        document.getElementById('cardNumber').addEventListener('keypress', function (e) {
            if (!/[0-9]/.test(e.key) && e.key !== 'Backspace') {
                e.preventDefault();
            }
        });

        // Only allow numbers for CVV
        document.getElementById('cvv').addEventListener('keypress', function (e) {
            if (!/[0-9]/.test(e.key) && e.key !== 'Backspace') {
                e.preventDefault();
            }
        });

        // Form submission handler
        document.getElementById('creditCardForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = {
                cardName: document.getElementById('cardName').value,
                cardNumber: document.getElementById('cardNumber').value,
                expMonth: document.getElementById('expMonth').value,
                expYear: document.getElementById('expYear').value,
                cvv: document.getElementById('cvv').value,
                zipCode: document.getElementById('zipCode').value
            };

            // Basic validation
            if (formData.cardNumber.replace(/\s/g, '').length < 13) {
                alert('Please enter a valid card number');
                return;
            }

            if (formData.cvv.length < 3) {
                alert('Please enter a valid CVV');
                return;
            }

            // Success message (in production, this would send to a payment processor)
            alert('Payment form submitted successfully!\n\nNote: This is a demo form. No actual payment will be processed.');

            console.log('Form data:', formData);
        });
    </script>
</body>

</html>
